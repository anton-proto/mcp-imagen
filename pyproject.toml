[project]
name = "mcp-imagen-server"
version = "0.1.0"
description = "MCP server for Google Imagen API - text-to-image generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.53.0",
    "mcp>=1.23.1",
    "pillow>=12.0.0",
]

[project.scripts]
mcp-imagen-server = "mcp_imagen_server.server:main"

[dependency-groups]
dev = [
    "ruff>=0.14.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
